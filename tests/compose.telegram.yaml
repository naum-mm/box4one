# Intentionally independent of production compose: no fixed names, ports or host data.
services:
  db:
    image: mariadb:11.8
    environment:
      MARIADB_ROOT_PASSWORD: test-root-only
      MARIADB_DATABASE: telegram_test
      MARIADB_USER: test
      MARIADB_PASSWORD: test-only
    volumes: [test-db:/var/lib/mysql]
    networks: [test]
    mem_limit: 512m
    command: [--innodb-buffer-pool-size=32M, --performance-schema=OFF, --max-connections=20]
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 2s
      timeout: 3s
      retries: 60
  tests:
    build:
      context: ..
      dockerfile: tests/Dockerfile.telegram
    environment:
      DB_HOST: db
      MARIADB_DATABASE: telegram_test
      MARIADB_USER: test
      MARIADB_PASSWORD: test-only
      WORKER_API_TOKEN: worker-test-token
      DOWNLOAD_ACCESS_WORD: download-test-only
      QUEUE_ACCESS_WORD: queue-test-only
      TELEGRAM_INTERNAL_TOKEN: telegram-test-token-with-at-least-32-characters
      TELEGRAM_ALLOWED_USERS: '10000000001,10000000002'
      TELEGRAM_PUBLIC_URL: https://test.example.com
      JOBS_ROOT: /tmp/test-jobs
    depends_on:
      db: {condition: service_healthy}
    networks: [test]
    mem_limit: 512m
networks:
  test: {internal: true}
volumes:
  test-db:
