services:
  mariadb:
    image: mariadb:11.8
    container_name: ytdlp-mariadb
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}

    volumes:
      - ./mariadb/data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "healthcheck.sh",
          "--connect",
          "--innodb_initialized"
        ]

      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

    networks:
      - ytdlp-network


  backend:
    build:
      context: ./backend

    container_name: ytdlp-backend
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    depends_on:
      mariadb:
        condition: service_healthy
      download-proxy:
        condition: service_started

    environment:
      DB_HOST: mariadb
      DB_PORT: 3306

      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}

      WORKER_API_TOKEN: ${WORKER_API_TOKEN}
      JOB_TTL_MINUTES: ${JOB_TTL_MINUTES}

      DOWNLOAD_ACCESS_WORD: ${DOWNLOAD_ACCESS_WORD}
      QUEUE_ACCESS_WORD: ${QUEUE_ACCESS_WORD}

      TELEGRAM_INTERNAL_TOKEN: ${TELEGRAM_INTERNAL_TOKEN:-}
      TELEGRAM_ALLOWED_USERS: ${TELEGRAM_ALLOWED_USERS:-}
      TELEGRAM_PUBLIC_URL: https://${DOMAIN}
      TELEGRAM_MAX_ACTIVE_JOBS: ${TELEGRAM_MAX_ACTIVE_JOBS:-2}
      TELEGRAM_LINK_TTL_SECONDS: ${TELEGRAM_LINK_TTL_SECONDS:-600}
      URL_VALIDATION_PROXY: http://download-proxy:8080
      JOBS_ROOT: /data/ytdlp/jobs

    volumes:
      - ./jobs:/data/ytdlp/jobs:ro

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 12
    networks:
      - ytdlp-network


  nginx:
    image: nginx:alpine
    container_name: ytdlp-nginx
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    depends_on:
      - backend

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
      - ./jobs:/data/ytdlp/jobs:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro

    networks:
      - ytdlp-network
      - egress


  worker:
    build: ./worker
    container_name: ytdlp-worker
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    init: true
    environment:
      API_URL: http://backend:8000
      NO_PROXY: ""
      WORKER_API_TOKEN: ${WORKER_API_TOKEN}
      JOBS_DIR: /data/ytdlp/jobs
      POLL_INTERVAL: ${POLL_INTERVAL}
      VIDEO_PLAYLIST_LIMIT: ${VIDEO_PLAYLIST_LIMIT}
      AUDIO_PLAYLIST_LIMIT: ${AUDIO_PLAYLIST_LIMIT}
      MIN_FREE_GB: ${MIN_FREE_GB}
      MAX_JOB_GB: ${MAX_JOB_GB}
      DISK_CHECK_SECONDS: ${DISK_CHECK_SECONDS}
      RETRY_MAX_SECONDS: ${RETRY_MAX_SECONDS}
    volumes:
      - ./jobs:/data/ytdlp/jobs
    depends_on:
      backend:
        condition: service_healthy
      download-proxy:
        condition: service_started
    networks:
      - ytdlp-network

  cleanup:
    image: python:3.13-slim
    container_name: ytdlp-cleanup
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    init: true
    environment:
      API_URL: http://backend:8000
      WORKER_API_TOKEN: ${WORKER_API_TOKEN}
      JOBS_DIR: /data/ytdlp/jobs
    volumes:
      - ./cleanup/cleanup.py:/app/cleanup.py:ro
      - ./jobs:/data/ytdlp/jobs
    command: ["sh", "-c", "while true; do python /app/cleanup.py; sleep 300; done"]
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ytdlp-network

  download-proxy:
    build: ./download_proxy
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    pids_limit: 64
    networks: [ytdlp-network, egress]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  telegram-bot:
    profiles: [telegram]
    build: ./telegram_bot
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    pids_limit: 64
    tmpfs: ["/tmp:size=16m,mode=1777"]
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_INTERNAL_TOKEN: ${TELEGRAM_INTERNAL_TOKEN:-}
      TELEGRAM_ALLOWED_USERS: ${TELEGRAM_ALLOWED_USERS:-}
      TELEGRAM_API_URL: http://backend:8000
      TELEGRAM_POLL_SECONDS: ${TELEGRAM_POLL_SECONDS:-10}
      TELEGRAM_UPLOAD_LIMIT_BYTES: ${TELEGRAM_UPLOAD_LIMIT_BYTES:-49000000}
    depends_on:
      backend: {condition: service_healthy}
    networks: [ytdlp-network, egress]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

networks:
  ytdlp-network:
    driver: bridge
    internal: true
  egress:
    driver: bridge
